name: Supabase backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Check backup secret
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секрет SUPABASE_DB_URL не задан — бэкап пропущен."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump public schema
        if: steps.check.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          pg_dump "$DB_URL" --no-owner --no-privileges --schema=public \
            | gzip > "backup/nexus-public-$(date +%Y%m%d-%H%M).sql.gz"
          ls -la backup

      - name: Upload backup artifact
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backup/*.sql.gz
          retention-days: 30
